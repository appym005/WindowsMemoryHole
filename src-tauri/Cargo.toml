[package]
name = "blackhole-wheel"
version = "0.0.1"
edition = "2021"

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.7", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5.0"
arboard = "3.4"
dirs = "5.0"
parking_lot = "0.12"
tauri-plugin-global-shortcut = { version = "2.0.0", optional = true }
regex = "1.10"

[dependencies.tauri-build]
version = "2.0.0"

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dev-dependencies]
tempfile = "3.10"

[features]
windows-app = ["tauri", "tauri-plugin-global-shortcut"]

[[bin]]
name = "blackhole-wheel"
path = "src/main.rs"
required-features = ["windows-app"]
